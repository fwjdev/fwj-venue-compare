<style>
 :root{ --blue:#2b6cb0; --blue-d:#1a4e8a; --line:#d7dee8; --bg:#f3f6fb; }
 *{box-sizing:border-box}

 section{margin-bottom:34px}

 .tablewrap{overflow:auto;max-height:78vh;border:1px solid var(--line);border-radius:8px}
 table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
 th,td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
 thead th{position:sticky;top:0;background:var(--blue);color:#fff;font-size:12px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 var(--blue-d)}
 thead th.nosort{cursor:default}
 thead th .ar{opacity:.5;font-size:10px;margin-left:3px}
 tbody tr:nth-child(even){background:var(--bg)}
 tbody tr:hover{background:#e7f0fb}
 td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
 td.total{font-weight:700;color:var(--blue-d);background:#eaf2fb}
 .sub{color:#7a8391;font-size:11px}
 .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
 .c-need{background:#fde8e8;color:#b02a2a}
 .c-part{background:#fff3da;color:#8a5a00}
 .c-no{background:#e4f5e6;color:#1f7a34}
 a.src{color:var(--blue);text-decoration:none;font-size:12px;word-break:break-all}
 a.src:hover{text-decoration:underline}
 .staff{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:6px}
 .card{border:1px solid var(--line);border-radius:10px;padding:13px 15px}
 .card.big{border:2px solid var(--blue);background:#eef5fd}
 .card h3{margin:0 0 6px;font-size:14px}
 .card .n{font-size:30px;font-weight:800;color:var(--blue-d);line-height:1}
 .card .n small{font-size:13px;font-weight:700;color:#5b6472}
 .card ul{margin:8px 0 0;padding-left:18px;font-size:12.5px}
 .warn{background:#fff7e6;border:1px solid #ffe0a3;border-radius:10px;padding:12px 15px;font-size:12.5px;color:#7a4a00;margin-top:12px}
 .warn b{color:#8a3a00}
 .controls{margin:8px 0;font-size:13px}
 .controls input{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;width:min(320px,80vw)}
 footer{color:#6b7280;font-size:11px;padding:16px;border-top:1px solid var(--line);margin-top:20px}
 @media(max-width:600px){header h1{font-size:16px}}
</style></head>

 const cols = [
  {k:"name",label:"施設（ホール）",r:false,render:r=>`<b>${esc(r.name)}</b><div class="sub">${esc(r.hall)}</div>`},
  {k:"seat",label:"座席数",r:true,render:r=>`${r.seat.toLocaleString()}席`+(r.seatnote?`<div class="sub">${esc(r.seatnote)}</div>`:"")},
  {k:"cond",label:"最高料金の条件",r:false,render:r=>`<span class="sub">${esc(r.cond)}</span>`},
  {k:"fee",label:"施設使用料",r:true,render:r=>`<span class="num">${yen(r.fee)}</span>`,cls:"num"},
  {k:"stage",label:"舞台/業者",r:false,render:_=>`<span class="num">${yen(D.stage)}</span>`,cls:"num"},
  {k:"facil",label:"付帯設備",r:false,render:_=>`<span class="num">${yen(D.facil)}</span>`,cls:"num"},
  {k:"total",label:"合計",r:true,render:r=>`<span class="num">${yen(r.total)}</span>`,cls:"num total"},
  {k:"url",label:"出典",r:false,render:r=>`<a class="src" href="${r.url}" target="_blank" rel="noopener">公式↗</a>`},
 ];
 const el=document.getElementById(elId);
 let sortK="seat", sortAsc=false;
 function draw(){
  const rs=[...rows].sort((a,b)=>{let x=a[sortK],y=b[sortK];
    if(sortK==="stage")x=y=0; if(sortK==="facil")x=y=0;
    if(typeof x==="number"&&typeof y==="number")return sortAsc?x-y:y-x;
    return sortAsc?String(x).localeCompare(y,"ja"):String(y).localeCompare(x,"ja");});
  el.innerHTML="<thead><tr>"+cols.map(c=>{
    const ar=c.r?(sortK===c.k?(sortAsc?"▲":"▼"):"↕"):"";
    return `<th data-k="${c.k}" class="${c.r?"":"nosort"}">${c.label}${c.r?`<span class="ar">${ar}</span>`:""}</th>`;
  }).join("")+"</tr></thead><tbody>"+
   rs.map(r=>"<tr>"+cols.map(c=>`<td class="${c.cls||""}">${c.render(r)}</td>`).join("")+"</tr>").join("")+"</tbody>";
  el.querySelectorAll("th[data-k]").forEach(th=>{const c=cols.find(x=>x.k===th.dataset.k);if(!c||!c.r)return;
    th.onclick=()=>{if(sortK===c.k)sortAsc=!sortAsc;else{sortK=c.k;sortAsc=false;}draw();};});
 }
 draw();
}
feeTable("t-big","big"); feeTable("t-small","small");

const catChip = c => c==="必要"?'<span class="chip c-need">必要</span>':c==="一部"?'<span class="chip c-part">一部</span>':'<span class="chip c-no">不要</span>';
function resvTable(){

  "</tr></thead><tbody>"+rows.map(v=>`<tr>
   <td><b>${esc(v.name)}</b></td>
   <td>${esc(v.method)}</td>
   <td>${catChip(v.onsite)}<div class="sub">${esc(v.onsite_d)}</div></td>
   <td><span class="sub">${esc(v.timing)}</span></td>
   <td><span class="sub">${esc(v.reg)}</span></td>
   <td>${esc(v.tel)}<div class="sub">${esc(v.mail)}</div><a class="src" href="${v.src}" target="_blank" rel="noopener">公式↗</a></td>
   <td>${v.form_url?`<a class="src" href="${v.form_url}" target="_blank" rel="noopener">${esc(v.form)} ↗</a>`:`<span class="sub">${esc(v.form)}</span>`}</td>
  </tr>`).join("")+"</tbody>";
}
resvTable();
document.getElementById("q").addEventListener("input",resvTable);
